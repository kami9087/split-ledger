<style>
/* Layout: app shell — glass top bar + tabbed workspace; premium indigo-violet gradient theme, Inter type, soft layered cards */
:root{
  --bg:#F5F6FC; --surface:#FFFFFF; --surface2:#EEF0FA; --ink:#0F1224; --muted:#5E6483; --line:#E4E7F4;
  --accent:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#ECEBFF; --warn:#B45309; --bad:#D63D4F; --good:#0E9F6E;
  --g1:#4F46E5; --g2:#8B5CF6; --g3:#D946EF;
  --grad:linear-gradient(135deg,var(--g1),var(--g2));
  --hero:linear-gradient(135deg,#2E2A86 0%,#4F46E5 52%,#8B5CF6 100%);
  --m1:#6366F1; --m2:#06B6A4; --m3:#F59E0B; --m4:#A855F7; --m5:#F43F5E;
  --shadow:0 1px 2px rgba(15,18,36,.04),0 14px 30px -20px rgba(49,46,129,.28);
  --glow:0 16px 36px -14px color-mix(in srgb,var(--g1) 55%,transparent);
  --f-display:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0B1E; --surface:#12142B; --surface2:#1A1D3A; --ink:#EEF0FF; --muted:#9AA0C6; --line:#272B50;
  --accent:#A5B4FF; --accent-soft:#1E2150; --warn:#F0A64E; --bad:#FB7185; --good:#34D399;
  --g1:#6366F1; --g2:#A855F7;
  --hero:linear-gradient(135deg,#2A2680 0%,#4338CA 50%,#7C3AED 100%);
  --m1:#818CF8; --m2:#2DD4BF; --m3:#FBBF24; --m4:#C084FC; --m5:#FB7185;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -20px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0B1E; --surface:#12142B; --surface2:#1A1D3A; --ink:#EEF0FF; --muted:#9AA0C6; --line:#272B50;
  --accent:#A5B4FF; --accent-soft:#1E2150; --warn:#F0A64E; --bad:#FB7185; --good:#34D399;
  --g1:#6366F1; --g2:#A855F7;
  --hero:linear-gradient(135deg,#2A2680 0%,#4338CA 50%,#7C3AED 100%);
  --m1:#818CF8; --m2:#2DD4BF; --m3:#FBBF24; --m4:#C084FC; --m5:#FB7185;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -20px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:radial-gradient(900px 420px at 90% -8%,color-mix(in srgb,var(--g2) 16%,transparent),transparent 70%),radial-gradient(800px 380px at -10% 2%,color-mix(in srgb,var(--g1) 14%,transparent),transparent 70%),var(--bg);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:color-mix(in srgb,var(--g2) 28%,transparent)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.money{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 110px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .38s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--surface) 78%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent)}
.bar-in{max-width:1180px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand>div:last-child{min-width:0}
.mark{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;letter-spacing:.02em;overflow:hidden;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--g1) 70%,transparent)}
.mark.img{background:transparent;box-shadow:none}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font-weight:750;font-size:16.5px;letter-spacing:-.015em;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:20px;background:var(--surface2);padding:3px;border-radius:13px}
.tabs button{border:0;background:none;padding:7px 15px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;transition:color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 6px 14px -6px color-mix(in srgb,var(--g1) 70%,transparent)}
.grow{flex:1;min-width:0}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 11px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 24%,transparent)}
.sync.local i{background:var(--warn)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.me img{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px color-mix(in srgb,var(--g2) 55%,transparent)}
/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 15px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{border-color:var(--g2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px color-mix(in srgb,var(--g1) 80%,transparent)}
.btn.pri:hover{box-shadow:0 12px 24px -10px color-mix(in srgb,var(--g1) 95%,transparent)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.btn:focus-visible,.in:focus-visible,.chip:focus-visible,.tabs button:focus-visible{outline:2px solid var(--g2);outline-offset:2px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 13px;min-width:0;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus{border-color:var(--g2);box-shadow:0 0 0 4px color-mix(in srgb,var(--g2) 18%,transparent)}
.in.big{font-family:var(--f-num);font-size:26px;font-weight:700;padding:9px 13px;letter-spacing:-.02em}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f>span,.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;color:var(--ink);transition:border-color .15s,background .15s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip[aria-pressed="true"]{border-color:var(--c,var(--g2));background:color-mix(in srgb,var(--c,var(--g2)) 12%,var(--surface));box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--g2)) 14%,transparent)}
/* layout */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:26px 0 16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(25px,3.2vw,33px);letter-spacing:-.03em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.015em;margin:0}
.sub{color:var(--muted);margin-top:6px;max-width:640px;font-size:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:10px}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-num);font-weight:750;font-size:clamp(19px,2.1vw,25px);letter-spacing:-.025em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--hero);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.kpi.hero small,.kpi.hero span{color:rgba(255,255,255,.78)}
.row{display:flex;align-items:center;gap:10px}.wrapr{flex-wrap:wrap}.between{justify-content:space-between}
.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}
.empty{padding:30px 14px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:14px;margin:4px 0}
.empty b{color:var(--ink);font-size:15px}
.seg{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:12px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* hero summary */
.hero2{position:relative;overflow:hidden;border-radius:24px;padding:24px;color:#fff;background:var(--hero);box-shadow:var(--glow)}
.hero2:before{content:"";position:absolute;right:-90px;top:-130px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 65%)}
.hero2:after{content:"";position:absolute;left:-70px;bottom:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g2) 55%,transparent),transparent 65%)}
.hero2>*{position:relative;z-index:1}
.hero-top small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.82}
.hero-top b{display:block;font-size:clamp(36px,7vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1.08;margin-top:6px}
.hero-top span{opacity:.88;font-size:13.5px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:22px}
.hero-stats>div{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.hero-stats small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.78}
.hero-stats b{display:block;font-size:clamp(15px,2.4vw,20px);font-weight:750;margin-top:4px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-stats span{display:block;font-size:11.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* member split cards */
.split{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mem{position:relative;border-radius:var(--r);padding:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow);min-width:0;transition:transform .2s,box-shadow .2s}
.mem:hover{transform:translateY(-2px)}
.mem:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--mc),color-mix(in srgb,var(--mc) 55%,#fff))}
.mem .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,color-mix(in srgb,var(--mc) 70%,#fff),var(--mc));color:#fff;display:grid;place-items:center;font-weight:800;font-size:14.5px;flex:none;box-shadow:0 6px 12px -6px var(--mc)}
.mem .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem .pc{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.mem .amt{font-family:var(--f-num);font-weight:800;font-size:22px;letter-spacing:-.03em;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:12px 0 0;font-size:12px}
.mem dt{color:var(--muted)}.mem dd{margin:0;text-align:right;font-family:var(--f-num)}
.due{display:inline-flex;margin-top:12px;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;font-family:var(--f-num)}
.due.pos{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.due.zero{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.due.neg{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
.stack{display:flex;height:11px;border-radius:99px;overflow:hidden;background:var(--surface2);margin-top:8px;gap:2px}
.stack i{display:block;height:100%;border-radius:99px}
/* tables */
.tw{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr{transition:background .12s}
tbody tr:hover{background:color-mix(in srgb,var(--g2) 5%,transparent)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.refunded td{opacity:.5}tr.refunded td.money{text-decoration:line-through}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--c,var(--muted)) 13%,transparent);color:color-mix(in srgb,var(--c,var(--ink)) 78%,var(--ink));white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:8px;font-size:13px;font-weight:600}
.x:hover{background:var(--surface2);color:var(--ink)}
/* charts */
svg.chart{width:100%;height:auto;display:block}
.hbar{display:grid;grid-template-columns:minmax(90px,1.2fr) 3fr auto;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.hbar .t{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.hbar .t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--g1)) 65%,#fff),var(--c,var(--g1)))}
.hbar .v{font-family:var(--f-num);font-size:12.5px;text-align:right;white-space:nowrap}
.hbar .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
/* add order */
.add{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px}
.preview{background:linear-gradient(160deg,var(--accent-soft),var(--surface2));border:1px solid color-mix(in srgb,var(--g2) 14%,var(--line));border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;align-self:start}
.preview .ln{display:flex;justify-content:space-between;font-size:13.5px;gap:10px}
.preview .ln b{font-family:var(--f-num);font-weight:600}
.preview .tot{border-top:1px dashed color-mix(in srgb,var(--g2) 30%,var(--line));padding-top:10px;margin-top:4px}
.preview .tot b{font-size:21px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
.pp div{background:var(--surface);border-radius:10px;padding:7px 6px;text-align:center;border-top:3px solid var(--mc);min-width:0}
.pp small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp b{font-family:var(--f-num);font-size:12.5px;font-weight:600;white-space:nowrap}
.toggle{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.toggle button{border:0;background:none;border-radius:9px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* modal, toast, fab, bottom nav */
.modal{position:fixed;inset:0;z-index:60;background:rgba(12,10,40,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 16px;overflow-y:auto}

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);

const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-").map(Number); return `${d} ${MONTHS[m - 1]} ${y}`; };
const CURS = ["GBP","USD","EUR","AUD","CAD","NZD","AED","SAR","PKR","INR"];
const MCOLS = ["var(--m1)","var(--m2)","var(--m3)","var(--m4)","var(--m5)"];
const SITECOLS = ["#6366F1","#06B6A4","#F59E0B","#A855F7","#F43F5E","#0EA5E9","#84CC16","#FB7185"];
const ICON = {
  overview:'M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 7h6V4h-6z', orders:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6', expenses:'M4 7h16v12H4zM4 11h16M8 15h3',
  payouts:'M3 12h13M12 7l5 5-5 5M20 5v14', settings:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4'
};
const ic = (n, w = 18) => `<svg viewBox="0 0 24 24" width="${w}" height="${w}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[n]}"/></svg>`;
function toast(t) { document.querySelectorAll(".toast").forEach(x => x.remove()); const e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2400); }

/* ---------- state ---------- */
const DEFAULT_CFG = () => ({
  base: "GBP",
  brand: "",
  members: ["Member 1","Member 2","Member 3","Member 4","Member 5"].map((name, i) => ({ id: "m" + (i + 1), name, share: 20 })),
  sites: [],
  gateways: [
    { id: "g1", name: "Stripe", pct: 2.9, fixed: 0.3 },
    { id: "g2", name: "PayPal", pct: 3.49, fixed: 0.49 },
    { id: "g3", name: "Bank transfer", pct: 0, fixed: 0 }

  rates: {}

const S = { cfg: null, orders: [], expenses: [], payouts: [], mode: "connecting", db: null, user: null, uid: null, canWrite: true, cfgMissing: false, more: { orders: false } };
const UI = { tab: "overview", period: "month", from: "", to: "", fSite: "", fGw: "", fStatus: "", q: "", confirm: null, names: {} };
try { const t = localStorage.getItem("tsl-tab"); if (t) UI.tab = t; } catch (e) {}
const cfg = () => S.cfg || DEFAULT_CFG();
const memberById = id => cfg().members.find(m => m.id === id);
const siteById = id => cfg().sites.find(s => s.id === id);
const gwById = id => cfg().gateways.find(g => g.id === id);
const siteColor = s => s ? (s.color || SITECOLS[cfg().sites.indexOf(s) % SITECOLS.length]) : "var(--muted)";
const fmtM = (n, cur) => { cur = cur || cfg().base; try { return new Intl.NumberFormat(undefined, { style: "currency", currency: cur, maximumFractionDigits: 2, minimumFractionDigits: 2 }).format(n || 0); } catch (e) { return cur + " " + (n || 0).toFixed(2); } };
const fmtS = n => fmtM(n).replace(/\.00(?=\D*$)/, "");

/* ---------- money maths ---------- */
function calcOrder(o) {
  const gw = gwById(o.gateway) || { pct: 0, fixed: 0 };
  const gross = num(o.amount);
  let fee;
  if (o.feeMode === "net") fee = Math.max(0, gross - num(o.netIn));
  else if (o.feeMode === "manual") fee = num(o.feeIn);
  else fee = gross > 0 ? gross * num(gw.pct) / 100 + num(gw.fixed) : 0;
  fee = r2(fee); const net = r2(gross - fee); const rate = o.currency === cfg().base ? 1 : num(o.rate) || num(cfg().rates[o.currency]) || 0;
  return { gross, fee, net, rate, grossB: r2(gross * rate), feeB: r2(fee * rate), netB: r2(net * rate) };
}
const ordB = o => ({ grossB: num(o.grossB), feeB: num(o.feeB), netB: num(o.netB) });
const live = o => o.status !== "refunded";
const expB = e => num(e.amountB);
function sharesOf(pool) { return cfg().members.map(m => ({ m, v: r2(pool * num(m.share) / 100) })); }
function periodRange(p) {
  const d = new Date(); const y = d.getFullYear(), mo = d.getMonth();
  if (p === "month") return [ymd(new Date(y, mo, 1)), ymd(new Date(y, mo + 1, 0))];

}
const inRange = (d, [a, b]) => d >= a && d <= b;
function totals(range) {
  const os = S.orders.filter(o => inRange(o.date, range)); const ok = os.filter(live);
  const gross = ok.reduce((a, o) => a + ordB(o).grossB, 0), fees = ok.reduce((a, o) => a + ordB(o).feeB, 0), net = ok.reduce((a, o) => a + ordB(o).netB, 0);
  const ex = S.expenses.filter(e => inRange(e.date, range)).reduce((a, e) => a + expB(e), 0);
  return { os, ok, gross: r2(gross), fees: r2(fees), net: r2(net), ex: r2(ex), pool: r2(net - ex), refunds: os.length - ok.length };
}
function balances() {
  const all = totals(["0000-01-01", "9999-12-31"]);
  return cfg().members.map(m => {
    const earned = r2(all.pool * num(m.share) / 100);
    const reimb = r2(S.expenses.filter(e => e.paidBy === m.id).reduce((a, e) => a + expB(e), 0));
    const paid = r2(S.payouts.filter(p => p.member === m.id).reduce((a, p) => a + num(p.amount), 0));
    return { m, earned, reimb, paid, due: r2(earned + reimb - paid) };
  });
}

/* ---------- storage: shared db, or local fallback ---------- */
const LKEY = "tsl-local-v1";
function localLoad() { try { const o = JSON.parse(localStorage.getItem(LKEY) || "null"); if (o) { S.cfg = o.cfg || DEFAULT_CFG(); S.orders = o.orders || []; S.expenses = o.expenses || []; S.payouts = o.payouts || []; return; } } catch (e) {} S.cfg = DEFAULT_CFG(); }
function localSave() { try { localStorage.setItem(LKEY, JSON.stringify({ cfg: S.cfg, orders: S.orders, expenses: S.expenses, payouts: S.payouts })); } catch (e) { toast("Could not save on this device"); } }
const sortCol = arr => arr.sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.createdAt || 0) - (a.createdAt || 0));
const store = {
  async add(col, data) {

  async update(col, id, data) {

async function boot() {

}
function onErr(e) { if (e && e.code === "permission-denied") { toast("You no longer have access to this ledger."); } render(); }

/* ---------- brand, first-run setup, responsive tables ---------- */
const LOGO = { ok: false };
(() => { const im = new Image(); im.onload = () => { LOGO.ok = true; paintBrand(true); }; im.src = "logo.png"; })();
function initials(b) { const w = (b || "").trim().split(/\s+/).filter(Boolean); return w.length ? (w.length > 1 ? w[0][0] + w[1][0] : w[0].slice(0, 2)).toUpperCase() : "SL"; }

const HIDE_SM = ["Fee", "Net", "Added by"];
function decorateTables() {
  document.querySelectorAll("#app .tw table").forEach(t => {

function monthChart() {

function previewHTML(f) {

  const per = sharesOf(k.netB);
  return `<div class="lbl">This order</div><div class="ln"><span>Order amount</span><b>${fmtM(k.gross, f.currency)}</b></div><div class="ln"><span>Payment fee</span><b style="color:var(--m2)">− ${fmtM(k.fee, f.currency)}</b></div><div class="ln"><span>Net received</span><b>${fmtM(k.net, f.currency)}</b></div>
  ${f.currency !== c.base ? `<div class="ln"><span>In ${esc(c.base)}</span><b>${needRate ? '<span class="tiny" style="color:var(--warn)">Add exchange rate</span>' : fmtM(k.netB)}</b></div>` : ""}
  <div class="ln tot"><span><b style="font-family:var(--f-body);font-size:13.5px;color:var(--ink)">Each person gets</b></span><b>${needRate ? "—" : fmtM(k.netB / Math.max(1, c.members.length))}</b></div>
  <div class="pp">${per.map(({ m, v }, i) => `<div style="--mc:${MCOLS[i % 5]}"><small>${esc(m.name)}</small><b>${needRate ? "—" : fmtS(v)}</b></div>`).join("")}</div>
  <div class="row wrapr" style="margin-top:10px">${S.canWrite ? `<button class="btn pri" type="submit" data-submit="close">${f.id ? "Save changes" : "Save order"}</button>${f.id ? "" : `<button class="btn" type="submit" data-submit="again">Save & add another</button>`}` : ""}${f.id ? `<button class="btn ghost" type="button" data-act="closeModal">Cancel</button>` : ""}</div>`;
}
function formData(form) {
  const o = Object.fromEntries(new FormData(form).entries()); o.amount = num(o.amount); if (o.feeMode === "net") o.netIn = num(o.netIn); else delete o.netIn; if (o.feeMode === "manual") o.feeIn = num(o.feeIn); else delete o.feeIn;
  if (o.currency === cfg().base) delete o.rate; else o.rate = num(o.rate); if (form.dataset.id) o.id = form.dataset.id; return o;
}

let draft = null;

  ${d.members.map((m, i) => `<div class="setrow"><span class="sw" style="background:${MCOLS[i % 5]}"></span><input class="in" id="mn${i}" data-d="members.${i}.name" value="${esc(m.name)}" aria-label="Member ${i + 1} name"><div class="row" style="gap:4px"><input class="in num" id="ms${i}" data-d="members.${i}.share" value="${esc(m.share)}" inputmode="decimal" style="text-align:right" aria-label="Share percent"><span class="muted">%</span></div><span></span></div>`).join("")}

  <div class="card"><h3>Websites</h3>${d.sites.map((s, i) => `<div class="setrow"><input type="color" class="sw" id="sc${i}" data-d="sites.${i}.color" value="${esc(s.color || SITECOLS[i % SITECOLS.length])}" aria-label="Colour"><input class="in" id="sn${i}" data-d="sites.${i}.name" value="${esc(s.name)}" aria-label="Website name"><span class="tiny muted num">${S.orders.filter(o => o.site === s.id).length} orders</span><button class="x" data-act="delSite" data-i="${i}" aria-label="Remove">✕</button></div>`).join("") || `<div class="tiny muted" style="padding:6px 0">No websites yet.</div>`}
  <form class="row" data-form="site" style="margin-top:8px"><input class="in" id="newsite" name="name" placeholder="e.g. mysite.com" required><button class="btn" type="submit">Add website</button></form></div>
  <div class="card"><h3>Payment methods & fees</h3><div class="setrow gw tiny muted" style="padding:0 0 4px"><span>Name</span><span>Fee %</span><span>Fixed fee</span><span></span></div>${d.gateways.map((g, i) => `<div class="setrow gw"><input class="in" id="gn${i}" data-d="gateways.${i}.name" value="${esc(g.name)}" aria-label="Method name"><input class="in num" id="gp${i}" data-d="gateways.${i}.pct" value="${esc(g.pct)}" inputmode="decimal" aria-label="Fee percent"><input class="in num" id="gf${i}" data-d="gateways.${i}.fixed" value="${esc(g.fixed)}" inputmode="decimal" aria-label="Fixed fee"><button class="x" data-act="delGw" data-i="${i}" aria-label="Remove">✕</button></div>`).join("")}
  <div class="row wrapr" style="margin-top:8px"><button class="btn sm" data-act="addGw">Add method</button><span class="tiny muted">Starting rates are examples. Change them to match your own accounts. The fixed fee is in the order's currency.</span></div></div>
  <div class="card"><h3>Currency</h3><label class="f" style="max-width:220px"><span>Main currency for totals and payouts</span><select class="in" id="basecur" data-d="base">${CURS.map(x => `<option ${d.base === x ? "selected" : ""}>${x}</option>`).join("")}</select></label>
  <div class="lbl" style="margin:16px 0 6px">Default exchange rates</div>${rateCurs.map(x => `<div class="setrow gw"><span class="small">1 ${x} =</span><input class="in num" id="rt${x}" data-d="rates.${x}" value="${esc((d.rates || {})[x] ?? "")}" inputmode="decimal" aria-label="Rate for ${x}"><span class="small muted">${esc(d.base)}</span><span></span></div>`).join("") || `<div class="tiny muted">Rates you type when adding an order in another currency are saved here.</div>`}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tb = e.target.closest("[data-tab]"); if (tb) { UI.tab = tb.dataset.tab; UI.confirm = null; if (UI.tab !== "settings") draft = null; try { localStorage.setItem("tsl-tab", UI.tab); } catch (x) {} document.querySelector(".modal")?.remove(); render(); const ap = $("#app"); ap.classList.remove("enter"); void ap.offsetWidth; ap.classList.add("enter"); scrollTo(0, 0); return; }
  const pr = e.target.closest("[data-period]"); if (pr) { UI.period = pr.dataset.period; render(); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { const form = pk.closest("form"); form.querySelector(`input[name=${pk.dataset.pick}]`).value = pk.dataset.v; form.querySelectorAll(`[data-pick=${pk.dataset.pick}]`).forEach(b => b.setAttribute("aria-pressed", b === pk)); refreshPreview(form); return; }
  const fm = e.target.closest("[data-fee]"); if (fm) { const form = fm.closest("form"); form.querySelector("input[name=feeMode]").value = fm.dataset.fee; form.querySelectorAll("[data-fee]").forEach(b => b.setAttribute("aria-pressed", b === fm)); form.querySelector("[data-show=net]").hidden = fm.dataset.fee !== "net"; form.querySelector("[data-show=manual]").hidden = fm.dataset.fee !== "manual"; refreshPreview(form); return; }
  const sb = e.target.closest("[data-submit]"); if (sb) { sb.closest("form").dataset.after = sb.dataset.submit; return; }
  const a = e.target.closest("[data-act]"); if (!a) { if (e.target.classList.contains("modal")) e.target.remove(); return; }
  const k = a.dataset.act;
  if (k === "openSkins") return openSkins();
  if (k === "skin") return pickSkin(a.dataset.k);
  if (k === "openSetup") return openSetup();
  if (k === "addOrder") return openOrder({});
  if (k === "editOrder") return openOrder(S.orders.find(o => o.id === a.dataset.id));
  if (k === "closeModal") return document.querySelector(".modal")?.remove();
  if (k === "askDel") { UI.confirm = a.dataset.k; render(); return; }
  if (k === "cancelConfirm") { UI.confirm = null; render(); return; }
  if (k === "delOrder") { UI.confirm = null; if (await store.del("orders", a.dataset.id)) toast("Order deleted"); return; }
  if (k === "delExp") { UI.confirm = null; if (await store.del("expenses", a.dataset.id)) toast("Expense deleted"); return; }
  if (k === "delPay") { UI.confirm = null; if (await store.del("payouts", a.dataset.id)) toast("Payout deleted"); return; }
  if (k === "toggleRefund") { const o = S.orders.find(x => x.id === a.dataset.id); if (await store.update("orders", o.id, { status: live(o) ? "refunded" : "paid" })) toast(live(o) ? "Marked as refunded" : "Refund undone"); return; }
  if (k === "payMember") { const s = $("#pmem"), am = $("#pamt"); if (s) { s.value = a.dataset.id; am.value = num(a.dataset.v).toFixed(2); am.focus(); am.scrollIntoView({ block: "center" }); } return; }
  if (k === "equalShares") { const n = draft.members.length; draft.members.forEach((m, i) => m.share = r2(i === n - 1 ? 100 - r2(100 / n) * (n - 1) : 100 / n)); render(); return; }
  if (k === "delSite") { const s = draft.sites[+a.dataset.i]; if (S.orders.some(o => o.site === s.id)) return toast("This website has orders, so it cannot be removed. Rename it instead."); draft.sites.splice(+a.dataset.i, 1); render(); return; }
  if (k === "addGw") { draft.gateways.push({ id: "g" + uid(), name: "New method", pct: 0, fixed: 0 }); render(); return; }
  if (k === "delGw") { const g = draft.gateways[+a.dataset.i]; if (S.orders.some(o => o.gateway === g.id)) return toast("This method has orders, so it cannot be removed. Rename it instead."); draft.gateways.splice(+a.dataset.i, 1); render(); return; }
  if (k === "resetDraft") { draft = null; render(); return; }
  if (k === "saveCfg") { const sum = draft.members.reduce((x, m) => x + num(m.share), 0); if (Math.abs(sum - 100) > .01) return toast(`Shares add up to ${r2(sum)}%. Make them total 100%.`);
    if (draft.members.some(m => !m.name.trim())) return toast("Every member needs a name");
    const c = structuredClone(draft); c.brand = (c.brand || "").trim(); c.members.forEach(m => m.share = num(m.share)); c.gateways.forEach(g => { g.pct = num(g.pct); g.fixed = num(g.fixed); }); Object.keys(c.rates).forEach(x => { c.rates[x] = num(c.rates[x]); if (!c.rates[x]) delete c.rates[x]; });
    if (await store.saveCfg(c)) { draft = null; toast("Settings saved for the team"); render(); } return; }
  if (k === "csv") return exportCSV(a.dataset.v);
  if (k === "backup") return save(`team-ledger-backup-${today()}.json`, JSON.stringify({ app: "team-split-ledger", saved: new Date().toISOString(), cfg: cfg(), orders: S.orders, expenses: S.expenses, payouts: S.payouts }, null, 1));
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.d && draft) { const path = el.dataset.d.split("."); let o = draft; for (let i = 0; i < path.length - 1; i++) { o[path[i]] = o[path[i]] ?? {}; o = o[path[i]]; } o[path[path.length - 1]] = el.value; if (el.dataset.d.endsWith("share")) { const sum = draft.members.reduce((a, m) => a + num(m.share), 0); const h = el.closest(".card").querySelector("h3 span"); h.textContent = `Shares total ${r2(sum)}%`; h.style.color = Math.abs(sum - 100) < .01 ? "var(--good)" : "var(--bad)"; } return; }
  const sf = el.closest("form[data-form=setup]"); if (sf) { if (el.name && el.name[0] === "s" && el.name.length === 2) sf.dataset.touched = "1"; if (!sf.dataset.touched) equalizeSetup(sf); setupTotal(sf); return; }
  const form = el.closest("form[data-form=order]"); if (form) { refreshPreview(form); return; }
  if (el.id === "q") { UI.q = el.value; render(); }
  if (el.id === "pfrom") { UI.from = el.value; render(); } if (el.id === "pto") { UI.to = el.value; render(); }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (["fSite", "fGw", "fStatus"].includes(el.id)) { UI[el.id] = el.value; render(); return; }
  if (el.id === "basecur" && draft) { draft.base = el.value; render(); return; }
  if (el.dataset.d && draft) return;
  const form = el.closest("form");
  if (form && form.dataset.form === "order" && el.name === "currency") { const c = cfg(); const rw = form.querySelector("[data-show=rate]"); rw.hidden = el.value === c.base; rw.querySelector("[data-curlbl]").textContent = el.value; const ri = rw.querySelector("input"); ri.value = c.rates[el.value] || ""; refreshPreview(form); return; }
  if (form && form.dataset.form === "expense" && el.name === "currency") { const c = cfg(); const rw = form.querySelector("[data-show=erate]"); rw.hidden = el.value === c.base; rw.querySelector("[data-curlbl]").textContent = el.value; rw.querySelector("input").value = c.rates[el.value] || ""; return; }
  if (el.id === "imp" && el.files[0]) importBackup(el.files[0]);
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const form = e.target; const t = form.dataset.form; const c = cfg();
  if (t === "setup") {
    const f = new FormData(form); const brand = String(f.get("brand") || "").trim(); const base = String(f.get("base") || "GBP");
    const members = [1, 2, 3, 4, 5].map(i => ({ name: String(f.get("n" + i) || "").trim(), share: num(f.get("s" + i)) })).filter(x => x.name);
    if (!brand) return toast("Enter your business name");
    if (!members.length) return toast("Add at least one team member");
    const sum = members.reduce((a, x) => a + x.share, 0);
    if (Math.abs(sum - 100) > .01) return toast(`Shares add up to ${r2(sum)}%. Make them total 100%.`);
    const site = String(f.get("site") || "").trim();
    const nc = DEFAULT_CFG(); nc.brand = brand; nc.base = base;
    nc.members = members.map((x, i) => ({ id: "m" + (i + 1), name: x.name, share: x.share }));
    nc.sites = site ? [{ id: "s" + uid(), name: site, color: SITECOLS[0] }] : [];
    if (await store.saveCfg(nc)) { document.querySelector("#setup")?.remove(); draft = null; toast("Team saved. You can add your first order now."); }
    return;
  }
  if (t === "order") {
    const o = formData(form); if (!o.site) return toast("Choose a website"); if (!o.gateway) return toast("Choose how it was paid"); if (!(o.amount > 0)) return toast("Enter the order amount");
    if (o.currency !== c.base && !(o.rate > 0)) return toast(`Enter how much 1 ${o.currency} is in ${c.base}`);
    if (o.feeMode === "net" && (o.netIn > o.amount || o.netIn < 0)) return toast("Amount received cannot be more than the order amount");
    const k = calcOrder(o); const rec = { date: o.date || today(), site: o.site, gateway: o.gateway, amount: k.gross, currency: o.currency, feeMode: o.feeMode, fee: k.fee, net: k.net, rate: k.rate, grossB: k.grossB, feeB: k.feeB, netB: k.netB, ref: o.ref || "", customer: o.customer || "", note: o.note || "", status: o.id ? (S.orders.find(x => x.id === o.id) || {}).status || "paid" : "paid" };
    if (o.feeMode === "net") rec.netIn = o.netIn; if (o.feeMode === "manual") rec.feeIn = o.feeIn;
    if (o.currency !== c.base && num(c.rates[o.currency]) !== o.rate && S.canWrite) { const nc = structuredClone(c); nc.rates[o.currency] = o.rate; store.saveCfg(nc); }
    const ok = o.id ? await store.update("orders", o.id, rec) : await store.add("orders", rec); if (!ok) return;
    toast(o.id ? "Order updated" : `Order saved · ${fmtS(k.netB / Math.max(1, c.members.length))} each`);
    if (form.dataset.where === "modal" && form.dataset.after !== "again") { document.querySelector(".modal")?.remove(); }
    else { ["amount", "netIn", "feeIn", "ref", "customer", "note"].forEach(n => { const i = form.querySelector(`[name=${n}]`); if (i) i.value = ""; }); refreshPreview(form); form.querySelector("[name=amount]").focus(); }
    return;
  }
  if (t === "expense") { const o = Object.fromEntries(new FormData(form).entries()); const amt = num(o.amount); if (!(amt > 0)) return toast("Enter an amount"); const rate = o.currency === c.base ? 1 : num(o.rate) || num(c.rates[o.currency]); if (!rate) return toast(`Enter how much 1 ${o.currency} is in ${c.base}`);
    if (await store.add("expenses", { title: o.title.trim(), cat: o.cat, amount: amt, currency: o.currency, rate, amountB: r2(amt * rate), date: o.date || today(), paidBy: o.paidBy || "" })) { toast("Expense added"); form.reset(); form.querySelector("[name=date]").value = today(); } return; }
  if (t === "payout") { const o = Object.fromEntries(new FormData(form).entries()); const amt = num(o.amount); if (!(amt > 0)) return toast("Enter an amount");
    if (await store.add("payouts", { member: o.member, amount: r2(amt), date: o.date || today(), note: o.note || "" })) { toast(`Payout to ${(memberById(o.member) || {}).name || "member"} recorded`); } return; }
  if (t === "site") { const n = new FormData(form).get("name").trim(); if (!n) return; draft.sites.push({ id: "s" + uid(), name: n, color: SITECOLS[draft.sites.length % SITECOLS.length] }); render(); $("#newsite")?.focus(); toast("Added. Save settings to share it with the team."); return; }
  if (t === "rate") { const f = new FormData(form); const r = num(f.get("rate")); if (!r) return toast("Enter a rate"); draft.rates[f.get("cur")] = r; render(); return; }
});
function refreshPreview(form) { const p = form.querySelector("[data-preview]"); if (!p) return; const f = formData(form); f.amount = num(f.amount); const btnState = p.querySelector("[data-submit]") ? true : false; p.innerHTML = previewHTML(f); }
function openOrder(o) {
  if (!S.canWrite) return toast("You have view-only access");
  document.querySelector(".modal")?.remove(); const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true" aria-label="${o.id ? "Edit order" : "Add order"}"><div class="row between" style="margin-bottom:14px"><h2>${o.id ? "Edit order" : "Add an order"}</h2><button class="x" data-act="closeModal" aria-label="Close" style="font-size:18px">✕</button></div>${orderForm(o, "modal")}</div>`;
  document.body.appendChild(m); setTimeout(() => m.querySelector("[name=amount]")?.focus(), 30);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelector(".modal")?.remove(); });

/* ---------- export / import ---------- */
let DL = null;
async function save(filename, data) {
  if (DL === null) { try { DL = await window.claude?.use?.("downloads") ?? false; } catch (e) { DL = false; } }
  if (!DL) return toast("Downloads are not available here");
  try { await DL.save({ filename, data }); } catch (e) { if (e && e.code !== "declined") toast("Could not save the file"); }
}
function exportCSV(k) {
  const c = cfg(); const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`; let rows = [];
  if (k === "orders") { rows.push(["Date", "Website", "Payment method", "Ref", "Customer", "Note", "Status", "Currency", "Amount", "Fee", "Net", "Rate to " + c.base, "Net " + c.base, "Per person " + c.base]); S.orders.slice().reverse().forEach(o => rows.push([o.date, (siteById(o.site) || {}).name, (gwById(o.gateway) || {}).name, o.ref, o.customer, o.note, o.status || "paid", o.currency, o.amount, o.fee, o.net, o.rate, o.netB, live(o) ? r2(o.netB / c.members.length) : 0])); }
  if (k === "expenses") { rows.push(["Date", "What for", "Category", "Paid by", "Currency", "Amount", "Amount " + c.base]); S.expenses.slice().reverse().forEach(e => rows.push([e.date, e.title, e.cat, (memberById(e.paidBy) || {}).name || "Business account", e.currency, e.amount, e.amountB])); }
  if (k === "payouts") { rows.push(["Date", "Member", "Amount " + c.base, "Note"]); S.payouts.slice().reverse().forEach(p => rows.push([p.date, (memberById(p.member) || {}).name, p.amount, p.note])); }
  if (k === "split") { rows.push(["Member", "Share %", "Earned " + c.base, "Expenses paid", "Paid out", "Balance due"]); balances().forEach(b => rows.push([b.m.name, b.m.share, b.earned, b.reimb, b.paid, b.due])); }
  save(`team-ledger-${k}-${today()}.csv`, rows.map(r => r.map(q).join(",")).join("\r\n"));
}
function importBackup(file) {
  const fr = new FileReader(); fr.onload = async () => { try { const o = JSON.parse(fr.result); if (o.app !== "team-split-ledger") throw 0;
    const have = new Set(S.orders.map(x => x.ref + "|" + x.date + "|" + x.amount)); let n = 0;
    if (o.cfg && (S.cfgMissing || S.mode === "local")) await store.saveCfg(o.cfg);
    for (const col of ["orders", "expenses", "payouts"]) for (const r of o[col] || []) { const { id, ...rest } = r; if (col === "orders" && have.has(r.ref + "|" + r.date + "|" + r.amount)) continue; if (await store.add(col, rest)) n++; }
    toast(`Imported ${n} records`); } catch (e) { toast("That file is not a Team Split Ledger backup"); } }; fr.readAsText(file);
}

boot();
})();
</script>
